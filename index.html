<title>Something is in the box</title>
<meta name="description" content="There is something in the box.">
<meta property="og:title" content="Something is in the box">
<meta property="og:description" content="There is something in the box.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='30 86 200 150'%3E%3Crect x='46' y='114' width='168' height='116' rx='18' fill='%23f3d9b1'/%3E%3Crect x='118' y='114' width='24' height='116' fill='%23ebc995'/%3E%3Cellipse cx='102' cy='168' rx='9' ry='12' fill='%231c1b22'/%3E%3Cellipse cx='158' cy='168' rx='9' ry='12' fill='%231c1b22'/%3E%3Cellipse cx='84' cy='190' rx='12' ry='7' fill='%23f6a6b2'/%3E%3Cellipse cx='176' cy='190' rx='12' ry='7' fill='%23f6a6b2'/%3E%3Crect x='36' y='92' width='188' height='30' rx='12' fill='%23e2bf8c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #1c1b22;
    --muted: #8a8894;
    --line: #ecebf0;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    padding-inline: 16px;
    display: grid;
    place-items: center;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding-block: 48px;
    text-align: center;
    max-width: 520px;
    width: 100%;
  }
  .label {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .timer {
    display: flex;
    gap: 6px;
    align-items: flex-start;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-variant-numeric: tabular-nums;
    transition: opacity .6s;
  }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 3.2ch; }
  .num { font-size: clamp(34px, 9vw, 52px); font-weight: 500; line-height: 1; }
  .sep { font-size: clamp(34px, 9vw, 52px); line-height: 1; color: var(--line); }
  .unit span:last-child { font-size: 10px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }

  h1 {
    font-weight: 500;
    font-size: clamp(22px, 5.5vw, 30px);
    text-wrap: balance;
    margin: 0;
    letter-spacing: -.01em;
  }

  .stage { position: relative; width: min(260px, 70vw); aspect-ratio: 1 / 1; max-width: 100%; }
  .stage svg { width: 100%; height: 100%; overflow: visible; }

  /* ---------- the box ---------- */
  .box { transform-origin: 130px 230px; animation: breathe 3.2s ease-in-out infinite; cursor: pointer; }
  .lid { transform-origin: 40px 110px; transition: transform .5s cubic-bezier(.3,1.6,.5,1); }
  .box:hover .lid, .box.peek .lid { transform: rotate(-9deg) translateY(-6px); }
  .box.wiggle { animation: wiggle .5s ease-in-out; }
  .eyes { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
  .shadow { animation: shadow 3.2s ease-in-out infinite; transform-origin: 130px 244px; }
  .glow { opacity: 0; transition: opacity .4s; }
  .box:hover .glow, .box.peek .glow { opacity: 1; }

  /* ---------- the critter ---------- */
  .critter-pos { transform: translateY(0); transition: transform .8s cubic-bezier(.3,1.5,.5,1) .45s; }
  .critter { opacity: 0; transform-origin: 130px 222px; cursor: pointer; }
  .arm-wave { transform-box: fill-box; transform-origin: 0% 60%; }

  /* ---------- reveal: lid flips open, critter pops up ---------- */
  .open .box { cursor: default; }
  .open .box .lid { transform-origin: 130px 107px; transform: translate(0,-31px) rotate(-8deg) scale(.56) !important; transition: transform .9s cubic-bezier(.3,1.4,.5,1) .45s; }
  .open .lid-bob { animation: bounce 2.4s 1.4s ease-in-out infinite; }
  .open .box .glow { opacity: 1; }
  .open .critter-pos { transform: translateY(-90px); }
  .open .critter { opacity: 1; animation: bounce 2.4s 1.4s ease-in-out infinite; }
  .open .arm-wave { animation: wave 1.2s 1.4s ease-in-out 3; }
  .critter.hop { animation: hop .45s ease-out !important; }

  @keyframes breathe { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .09 } 50% { transform: scaleX(.9); opacity: .06 } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
  @keyframes wiggle { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-4deg) } 75% { transform: rotate(4deg) } }
  @keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  @keyframes wave { 0%,100% { transform: rotate(0) } 30% { transform: rotate(-35deg) } 60% { transform: rotate(10deg) } }
  @keyframes hop { 0% { transform: translateY(0) scale(1,1) } 30% { transform: translateY(4px) scale(1.06,.92) } 60% { transform: translateY(-22px) scale(.96,1.05) } 100% { transform: translateY(0) scale(1,1) } }

  .preview-btn {
    font: 500 12px "JetBrains Mono", ui-monospace, Menlo, monospace;
    letter-spacing: .06em;
    color: var(--muted);
    background: none;
    border: 1px dashed var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .preview-btn:hover { color: var(--ink); border-color: var(--muted); }
  .preview-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .hint { font-size: 14px; color: var(--muted); margin: 0; min-height: 1.4em; }

  @media (prefers-reduced-motion: reduce) {
    .box, .eyes, .shadow, .open .critter { animation: none; }
    .critter-pos, .open .box .lid { transition: none; }
    .open .lid-bob { animation: none; }
  }
</style>

<main>
  <div class="label" id="label">Opens in</div>
  <div class="timer" id="timer" aria-live="polite">
    <div class="unit"><span class="num" id="d">00</span><span>days</span></div>
    <span class="sep">:</span>
    <div class="unit"><span class="num" id="h">00</span><span>hrs</span></div>
    <span class="sep">:</span>
    <div class="unit"><span class="num" id="m">00</span><span>min</span></div>
    <span class="sep">:</span>
    <div class="unit"><span class="num" id="s">00</span><span>sec</span></div>
  </div>

  <h1 id="headline">There is something in the box.</h1>

  <div class="stage" id="stage">
    <svg viewBox="0 0 260 260" role="img" aria-label="A small smiling cardboard box">
      <ellipse class="shadow" cx="130" cy="244" rx="78" ry="9" fill="#1c1b22" opacity=".09"/>

      <!-- the box -->
      <g class="box" id="box">
        <ellipse class="glow" cx="130" cy="112" rx="80" ry="16" fill="#fff6c8"/>
        <!-- the critter, hiding in the box -->
        <g class="critter-pos"><g class="critter" id="critter">
          <ellipse cx="110" cy="219" rx="11" ry="4" fill="#a9b3f0"/>
          <ellipse cx="150" cy="219" rx="11" ry="4" fill="#a9b3f0"/>
          <ellipse cx="80" cy="196" rx="10" ry="7" fill="#b9c2f7" transform="rotate(-20 80 196)"/>
          <g class="arm-wave"><ellipse cx="182" cy="194" rx="10" ry="7" fill="#b9c2f7" transform="rotate(20 182 194)"/></g>
          <ellipse cx="130" cy="192" rx="50" ry="28" fill="#c9d0ff"/>
          <ellipse cx="118" cy="176" rx="18" ry="7" fill="#dfe3ff" opacity=".8"/>
          <g class="eyes">
            <ellipse cx="114" cy="190" rx="4.5" ry="6" fill="#1c1b22"/>
            <ellipse cx="146" cy="190" rx="4.5" ry="6" fill="#1c1b22"/>
            <circle cx="115.5" cy="188" r="1.6" fill="#fff"/>
            <circle cx="147.5" cy="188" r="1.6" fill="#fff"/>
          </g>
          <ellipse cx="102" cy="201" rx="7" ry="4" fill="#f6a6b2" opacity=".75"/>
          <ellipse cx="158" cy="201" rx="7" ry="4" fill="#f6a6b2" opacity=".75"/>
          <path d="M124 199 q3 4 6 0 q3 4 6 0" stroke="#1c1b22" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g></g>

        <rect x="46" y="114" width="168" height="116" rx="18" fill="#f3d9b1"/>
        <rect x="46" y="114" width="168" height="20" rx="6" fill="#e2bf8c" opacity=".55"/>
        <rect x="118" y="114" width="24" height="116" fill="#ebc995" opacity=".8"/>
        <g class="eyes">
          <ellipse cx="102" cy="168" rx="6" ry="8" fill="#1c1b22"/>
          <ellipse cx="158" cy="168" rx="6" ry="8" fill="#1c1b22"/>
          <circle cx="104" cy="165" r="2" fill="#fff"/>
          <circle cx="160" cy="165" r="2" fill="#fff"/>
        </g>
        <ellipse cx="86" cy="186" rx="10" ry="6" fill="#f6a6b2" opacity=".7"/>
        <ellipse cx="174" cy="186" rx="10" ry="6" fill="#f6a6b2" opacity=".7"/>
        <path d="M122 186 q8 8 16 0" stroke="#1c1b22" stroke-width="3" fill="none" stroke-linecap="round"/>
        <g class="lid-bob"><g class="lid">
          <rect x="36" y="92" width="188" height="30" rx="12" fill="#e2bf8c"/>
          <rect x="118" y="92" width="24" height="30" fill="#d6ae76" opacity=".8"/>
        </g></g>
      </g>
    </svg>
  </div>

  <p class="hint" id="hint">Tap the box</p>
  <button type="button" id="preview-btn" class="preview-btn">Preview reveal (testing only)</button>
</main>

<script>
  // Change this to your reveal time (ISO format with timezone)
  const REVEAL_AT = new Date("2026-09-26T12:00:00+10:00");
  // Testing button under the box. Set to false before you put the site live.
  const SHOW_PREVIEW_BUTTON = false;
  let PREVIEW = SHOW_PREVIEW_BUTTON && location.hash === "#reveal";
  addEventListener("hashchange", () => { if (SHOW_PREVIEW_BUTTON && location.hash === "#reveal") { PREVIEW = true; tick(); } });

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const box = $("box"), critter = $("critter");
  const boxLines = ["Not yet.", "Patience.", "It's still in there.", "Stop poking me.", "Something moved.", "Soon."];
  const critterLines = ["hi.", "it was very dark in here.", "thanks for waiting.", "i'm wearing the lid now.", "boop.", "don't put me back."];
  let bi = 0, ci = 0, done = false;

  function reveal() {
    if (done) return;
    done = true;
    $("stage").classList.add("open");
    $("label").textContent = "Opened";
    $("timer").style.opacity = ".25";
    $("headline").textContent = "Oh. Hi.";
    $("hint").textContent = "It was in there the whole time.";
    $("stage").querySelector("svg").setAttribute("aria-label", "A small periwinkle creature peeking out of the box");
  }

  function tick() {
    let ms = PREVIEW ? 0 : REVEAL_AT - Date.now();
    if (ms <= 0) { ms = 0; reveal(); }
    const s = Math.floor(ms / 1000);
    $("d").textContent = pad(Math.floor(s / 86400));
    $("h").textContent = pad(Math.floor(s / 3600) % 24);
    $("m").textContent = pad(Math.floor(s / 60) % 60);
    $("s").textContent = pad(s % 60);
  }
  tick();
  setInterval(tick, 1000);

  const pb = $("preview-btn");
  pb.hidden = !SHOW_PREVIEW_BUTTON;
  pb.addEventListener("click", () => { PREVIEW = true; tick(); pb.hidden = true; });

  box.addEventListener("click", () => {
    if (done) return;
    box.classList.remove("wiggle");
    void box.getBoundingClientRect();
    box.classList.add("wiggle", "peek");
    $("hint").textContent = boxLines[bi++ % boxLines.length];
    setTimeout(() => box.classList.remove("peek"), 700);
  });
  box.addEventListener("animationend", e => {
    if (e.animationName === "wiggle") box.classList.remove("wiggle");
  });

  critter.addEventListener("click", () => {
    if (!done) return;
    critter.classList.remove("hop");
    void critter.getBoundingClientRect();
    critter.classList.add("hop");
    $("hint").textContent = critterLines[ci++ % critterLines.length];
  });
  critter.addEventListener("animationend", e => {
    if (e.animationName === "hop") critter.classList.remove("hop");
  });
</script>
